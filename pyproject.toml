[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mf6pqc"
version = "0.2.0.dev0"
description = "Reactive-transport coupling between MODFLOW 6 and PhreeqcRM"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Zitao Wang", email = "zitao.wang@outlook.com"},
]
keywords = [
  "groundwater",
  "hydrogeology",
  "MODFLOW 6",
  "PhreeqcRM",
  "reactive transport",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "numpy>=1.26,<3",
  "modflowapi>=0.2,<0.3",
  "phreeqcrm>=0.0.15,<0.1",
]

[project.optional-dependencies]
examples = [
  "flopy>=3.9,<4",
  "scipy>=1.11,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
]
test = [
  "coverage>=7.6,<8",
]
dev = [
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/wangzitao21/mf6pqc"
Issues = "https://github.com/wangzitao21/mf6pqc/issues"

[tool.setuptools.packages.find]
include = ["mf6pqc*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
